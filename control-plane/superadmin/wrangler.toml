name = "superatom-code-engine"
main = "src/worker.ts"
account_id = "91e1058d99235b9c34602fb0c28916d3"
compatibility_date = "2026-05-23"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
class_name = "OrgDO"
name = "ORG"

[[durable_objects.bindings]]
class_name = "ProjectDO"
name = "PROJECT"

[[durable_objects.bindings]]
class_name = "GlobalDO"
name = "GLOBAL"

[[durable_objects.bindings]]
class_name = "ChannelDO"
name = "CHANNEL"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OrgDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ProjectDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["GlobalDO"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["ChannelDO"]

[vars]
# Secrets (JWT_SECRET, CLERK_SECRET_KEY, FLY_API_TOKEN, REPORTING_TOKEN, OPENROUTER_API_KEY) are NOT here — they live in
# .dev.vars (local dev, gitignored) and `wrangler secret` (deployed). Only non-secret config below.
VM_URL = "http://localhost:5050"
FLY_ORG_SLUG = "superatom"

# Clerk publishable key — used by GET /mobile/auth to render the sign-in page (same key as user-ui/main.tsx).
# Public by design (the frontend API host is encoded in it); NOT a secret.
CLERK_PUBLISHABLE_KEY = "pk_test_YXB0LWFsaWVuLTIxLmNsZXJrLmFjY291bnRzLmRldiQ"
# The reporting service — the ChannelDO POSTs answers to <REPORTING_URL>/render (Bearer REPORTING_TOKEN) to get
# a rendered card image + full-report URL for chat channels. Presence of this var ENABLES that path; unset ⇒
# the ChannelDO falls back to the plain Adaptive Card. Public URL (the returned png/html are public too).
REPORTING_URL = "https://reports.superatom.site"

# Speech-to-text model for POST /api/transcribe (module: src/transcription/). Any
# audio-capable OpenRouter model; changing it needs no code edit or redeploy of the module.
TRANSCRIBE_MODEL = "google/gemini-2.5-flash-lite"

# Hot-read cache for *.superatom.site subdomain → projectId resolution.
# Edge-cached + globally distributed, so the GlobalDO registry stays off the hot path.
[[kv_namespaces]]
binding = "DOMAINS"
id = "2f6f21f80d0a4526a9b1b4826c7a9614"

# CREDENTIALS — everything about WHICH credential is used and WHO may use it: provider key pools, the group a
# project belongs to, which keys are currently exhausted, and whatever other kinds of key we add later. Named
# for the subject, not for the proxy, because the proxy is only its first consumer.
#
# It never holds a secret VALUE. Values live in Worker secrets and are resolved by name at the moment of use,
# so this store can be read and edited by anyone who should see routing without handling a credential.
[[kv_namespaces]]
binding = "CREDENTIALS"
id = "c574f1b1a8494d64b143535f08163239"

[assets]
directory = "./dist/client"
binding = "ASSETS"          # expose env.ASSETS so the worker can serve SPA index fallbacks
# Worker handles SPA fallback per-prefix (/admin → admin index, /u → user index),
# so don't let the asset layer auto-serve a single root index.
not_found_handling = "none"

# Everything runs on superatom.site now (code.superatom.ai retired).
# *.superatom.site → this same worker (admin + per-subdomain user apps).
# Wildcard needs a zone route (custom_domain doesn't support wildcards). Requires the
# superatom.site zone to be active in this Cloudflare account + a "*" DNS record.
[[routes]]
  pattern = "*.superatom.site/*"
  zone_name = "superatom.site"

[[routes]]
  pattern = "superatom.site/*"
  zone_name = "superatom.site"

# Built dashboards: a React bundle per project, uploaded through the admin console and served from
# /dashboard/<id>/. The bucket is shared; the prefix dashboard/<project>/<dashId>/<build>/ keeps projects
# apart, and a build id in the path makes rollback a metadata change rather than a re-upload.
[[r2_buckets]]
binding = "PACKAGES"
bucket_name = "frontend-packages"
