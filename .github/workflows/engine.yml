# The engine image: tested, built on Linux, and put into our registry — from the `dev` branch only, on every push that
# changes what goes into it. By hand too: Actions → engine → Run workflow (branch dev), or gh workflow run engine.yml --ref dev.
# With copy_to_fly=<release> it only copies a release already in our registry into Fly's (one Fly dropped, or one built by
# the backup path, scripts/release-engine-local.sh): gh workflow run engine.yml --ref dev -f copy_to_fly=dev-<date>-<commit>
#
#   push to dev → every check (scripts/check-all.sh)  ─┐
#              → build linux/amd64 → R2 files by digest ┴→ named (dev-<date>-<commit>, dev) → copied to Fly → installer
#   The build runs beside the checks; it is named — and so can be chosen — only when they pass.
#
# The registry is files in our R2 bucket, served at registry.superatom.ai by the bucket's custom domain: no registry
# server. Boxes pull by digest and run only the version the platform pins for their project. Every action is pinned to
# a commit, as everything in the image is pinned: a build changes only when we change it.
name: engine

on:
  push:
    branches: [dev]
    # Only what goes into the image, or decides how it is built and checked: a docs-only commit releases nothing.
    paths:
      - Dockerfile
      - .dockerignore
      - vm/**
      - clients/*.ts
      - .github/workflows/engine.yml
      - scripts/registry-push.sh
      - scripts/registry-to-fly.sh
      - scripts/registry-name.sh
      - scripts/release.sh
      - scripts/check-all.sh
  workflow_dispatch:
    inputs:
      copy_to_fly:
        description: only copy this release (dev-<date>-<commit>) into Fly's registry — no build
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  copy-to-fly:
    if: github.event_name == 'workflow_dispatch' && inputs.copy_to_fly != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: registry
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: copy
        env:
          FLY_TOKEN: ${{ secrets.FLY_REGISTRY_TOKEN }}
        run: scripts/registry-to-fly.sh "${{ inputs.copy_to_fly }}" | tee -a "$GITHUB_STEP_SUMMARY"

  check:
    if: github.event_name == 'push' || inputs.copy_to_fly == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
      - name: pnpm 9.0.0 (the lockfiles' version)
        run: corepack enable && corepack prepare pnpm@9.0.0 --activate
      - name: install every part, exactly as locked
        run: |
          for d in vm connectors control-plane/superadmin control-plane/user-ui reporting cli; do
            echo "::group::$d"; (cd "$d" && pnpm install --frozen-lockfile) || exit 1; echo "::endgroup::"
          done
      - name: every check
        run: scripts/check-all.sh
      - name: if this failed
        if: failure()
        run: |
          {
            echo "### ✗ engine: the ${{ github.job }} job failed"
            echo ""
            echo "The failing step's log says what broke; each script ends a failure with a line starting → saying what to do."
            echo "Known failures and their fixes: docs/deploying-the-engine.md (\"When something fails\")."
            echo "Retry: Actions → engine → this run → Re-run failed jobs. Nothing half-published is ever visible to a box."
          } >> "$GITHUB_STEP_SUMMARY"

  # Built and uploaded IN PARALLEL with the checks, by its digest only: nobody can choose an image that has no name.
  image:
    if: github.event_name == 'push' || inputs.copy_to_fly == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # The R2 key lives in this environment, which only the dev branch may use: nothing else can write the registry.
    environment: registry
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: the release name
        id: v
        run: echo "tag=dev-$(date -u +%Y%m%d)-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - name: build (the layers' cache is kept by GitHub, so only what changed is rebuilt)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: BUILD_ID=${{ github.sha }}
          outputs: type=oci,dest=/tmp/engine.oci.tar
          cache-from: type=gha,scope=engine
          cache-to: type=gha,scope=engine,mode=max
          provenance: false
      - name: into the registry (R2), by its digest only — read back through registry.superatom.ai
        id: push
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: echo "digest=$(scripts/registry-push.sh /tmp/engine.oci.tar superatom-engine)" >> "$GITHUB_OUTPUT"
      - name: if this failed
        if: failure()
        run: |
          {
            echo "### ✗ engine: the ${{ github.job }} job failed"
            echo ""
            echo "The failing step's log says what broke; each script ends a failure with a line starting → saying what to do."
            echo "Known failures and their fixes: docs/deploying-the-engine.md (\"When something fails\")."
            echo "Retry: Actions → engine → this run → Re-run failed jobs. Nothing half-published is ever visible to a box."
          } >> "$GITHUB_STEP_SUMMARY"

  # Only when every check passed: the image is named (its build proven from the registry, a few kilobytes), copied to
  # Fly, and its installer published. Until then nothing can choose it.
  release:
    needs: [check, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: registry
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: named — dev-<date>-<commit> and dev — once it is proven to be this commit
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: scripts/registry-name.sh superatom-engine "${{ needs.image.outputs.digest }}" "$GITHUB_SHA" "${{ needs.image.outputs.tag }}" dev
      - name: into Fly's registry too (a Fly machine cannot sign in to another registry) — the same bytes, the same digest
        env:
          FLY_TOKEN: ${{ secrets.FLY_REGISTRY_TOKEN }}
        run: scripts/registry-to-fly.sh "${{ needs.image.outputs.tag }}" "${{ needs.image.outputs.digest }}"
      - name: its installer at get.superatom.site/engine/install.sh (a machine needs only curl and Docker)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: scripts/release.sh engine "${{ needs.image.outputs.tag }}" --channel latest --commit "$GITHUB_SHA" vm/apps/updater/install.sh
      - name: what was released
        run: |
          {
            echo "### engine ${{ needs.image.outputs.tag }}"
            echo ""
            echo "- pull: \`registry.superatom.ai/superatom-engine@${{ needs.image.outputs.digest }}\`"
            echo "- commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: if this failed
        if: failure()
        run: |
          {
            echo "### ✗ engine: the ${{ github.job }} job failed"
            echo ""
            echo "The failing step's log says what broke; each script ends a failure with a line starting → saying what to do."
            echo "Known failures and their fixes: docs/deploying-the-engine.md (\"When something fails\")."
            echo "Retry: Actions → engine → this run → Re-run failed jobs. Nothing half-published is ever visible to a box."
          } >> "$GITHUB_STEP_SUMMARY"
