# The engine's tool server (vm/apps/engine/tool-socket.ts) on every system an engine may run on: a socket file on Linux and
# macOS, a named pipe on Windows — the same HTTP over each. Its test needs nothing installed (Node's own modules only), so
# Node runs it as it is, on each runner. By hand too: gh workflow run tool-server.yml --ref <branch>.
name: tool-server

on:
  push:
    paths:
      - vm/apps/engine/tool-socket.ts
      - vm/apps/engine/test/tool-socket.test.mts
      - .github/workflows/tool-server.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: the tool server answers its turns and tickets
        working-directory: vm/apps/engine
        run: node --experimental-strip-types --no-warnings --test test/tool-socket.test.mts
