# XcodeGen project definition — the .xcodeproj is GENERATED, never hand-edited.
#   brew install xcodegen && xcodegen generate
# Committing this instead of project.pbxproj keeps the project reviewable in a diff.
name: Superatom
options:
  bundleIdPrefix: ai.superatom
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # Swift 5 language mode, on the Swift 6 toolchain. Chosen deliberately: this app is
    # built on AVAudioEngine taps, dispatch timers and ObjC delegate callbacks, which
    # predate strict concurrency. Under Swift 6 mode the compiler injects executor
    # assertions into those callbacks and the process traps as soon as audio starts —
    # it caused two shipped crashes here. All modern APIs (@Observable, async/await,
    # Swift Charts) work identically in Swift 5 mode.
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 8W7QX56MCL
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "7.0.0"
  # Silero-based voice activity detection, on device. Cuts continuous mic input into
  # speech segments so only actual speech is uploaded for transcription.
  RealTimeCutVAD:
    url: https://github.com/helloooideeeeea/RealTimeCutVADLibrary.git
    from: "1.0.14"

targets:
  Superatom:
    type: application
    platform: iOS
    sources:
      - path: Superatom
    dependencies:
      - package: GRDB
      - package: RealTimeCutVAD
        product: RealTimeCutVADLibrary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.superatom.ask
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Superatom/Info.plist
      properties:
        CFBundleDisplayName: Superatom
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Voice is the primary input, so recording must survive the screen locking or the
        # app going to the background mid-question.
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: Superatom listens so you can ask questions by voice.
        # App icon declared as LOOSE PNGs rather than an asset catalog. Xcode 26.6's actool
        # refuses to compile an app icon unless a simulator runtime matching its SDK is
        # installed (an 8GB download) — even for a device build. CFBundleIconFiles is the
        # pre-asset-catalog mechanism and has no such dependency. Move back to an
        # .appiconset once that Xcode requirement is gone.
        # The login redirect target. ASWebAuthenticationSession also needs the scheme
        # registered here so iOS routes superatom://auth back to this app.
        CFBundleURLTypes:
          - CFBundleURLName: ai.superatom.ask.auth
            CFBundleURLSchemes:
              - superatom
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon20x20
              - AppIcon29x29
              - AppIcon40x40
              - AppIcon60x60
            UIPrerenderedIcon: false
